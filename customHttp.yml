# Security response headers for the Amplify-hosted frontend.
#
# Added because Zoom's Marketplace review checks the app's Home URL for the
# OWASP baseline set (HSTS, X-Content-Type-Options, CSP, Referrer-Policy), but
# these are worth having regardless of Zoom.
#
# Monorepo format: keyed by appRoot, matching amplify.yml. The file must live in
# the *repository* root, not in frontend/ — Amplify only reads customHttp.yml
# from the repo root even for monorepo apps.
#
# The CSP is permissive by intent. The frontend uses inline <script> for
# analytics (gtag, Clarity) and inline style={{…}} throughout React, so
# 'unsafe-inline' is unavoidable without a nonce pipeline Amplify static hosting
# cannot provide. What the policy still buys: object-src 'none', a locked
# base-uri and form-action, framing denied, and an allowlist for every
# third-party origin the app actually talks to — so an injected <script src>
# pointing somewhere new is blocked.
applications:
  - appRoot: frontend
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Strict-Transport-Security'
            value: 'max-age=31536000; includeSubDomains'
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
          - key: 'X-Frame-Options'
            value: 'DENY'
          - key: 'Referrer-Policy'
            value: 'strict-origin-when-cross-origin'
          - key: 'Content-Security-Policy'
            value: >-
              default-src 'self';
              base-uri 'self';
              object-src 'none';
              frame-ancestors 'none';
              form-action 'self';
              upgrade-insecure-requests;
              script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.clarity.ms https://www.google.com https://www.gstatic.com;
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src 'self' data: https://fonts.gstatic.com;
              img-src 'self' data: blob: https:;
              connect-src 'self' https://api.hilomcollective.com https://auth.hilomcollective.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://clarity.ms https://*.clarity.ms https://www.google.com;
              frame-src 'self' https://open.spotify.com https://www.google.com
